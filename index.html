<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lung CT Segmentation</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #09111f;
      color: #eef4ff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #09111f; }
    main { width: min(1100px, calc(100% - 32px)); margin: auto; padding: 42px 0; }
    h1 { margin-bottom: 8px; }
    p { color: #aebdd2; line-height: 1.5; }

    .panel, .card {
      background: #111e31;
      border: 1px solid #2a3d58;
      border-radius: 14px;
    }

    .panel { padding: 22px; margin-top: 24px; }
    form { display: flex; align-items: end; gap: 14px; flex-wrap: wrap; }
    .file-field { flex: 1 1 330px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      color: inherit;
      background: #081424;
      border: 1px solid #405879;
      border-radius: 9px;
    }

    button {
      min-height: 45px;
      padding: 0 20px;
      color: white;
      font-weight: 700;
      background: #287ee8;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    button:disabled { cursor: wait; opacity: .65; }
    button:focus-visible, input:focus-visible { outline: 3px solid #8fc6ff; }
    #status { min-height: 24px; margin-bottom: 0; }
    #status.error { color: #ff9f9f; }

    .results {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .card { overflow: hidden; }
    .card h2 { margin: 0; padding: 13px 15px; font-size: 1rem; }
    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: black;
      border-top: 1px solid #2a3d58;
    }

    .notice { font-size: .9rem; }
    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      main { padding: 24px 0; }
      .results { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lung CT Segmentation</h1>
    <p>Upload a processed PNG CT slice or one axial DICOM slice to view the model's segmentation.</p>

    <section class="panel" aria-label="CT image upload">
      <form id="upload-form">
        <div class="file-field">
          <label for="ct-file">PNG or DICOM CT image</label>
          <input id="ct-file" type="file" accept=".png,.dcm,image/png,application/dicom" required>
        </div>
        <button id="predict-button" type="submit">Predict segmentation</button>
      </form>
      <p id="status" role="status" aria-live="polite">Select a .png or .dcm file to begin.</p>
    </section>

    <section id="results" class="results" aria-label="Prediction results" hidden>
      <article class="card">
        <h2>Original CT</h2>
        <img id="original-image" alt="Windowed grayscale CT slice">
      </article>
      <article class="card">
        <h2>Predicted mask</h2>
        <img id="mask-image" alt="Binary predicted segmentation mask">
      </article>
      <article class="card">
        <h2>Prediction overlay</h2>
        <img id="overlay-image" alt="CT slice with predicted region in red">
      </article>
    </section>
  </main>

  <script>
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("ct-file");
    const button = document.getElementById("predict-button");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.setAttribute("role", isError ? "alert" : "status");
    }

    if (window.location.protocol === "file:") {
      button.disabled = true;
      setStatus(
        "This page needs the prediction server. Start app.py, then open http://127.0.0.1:5000 instead of opening index.html directly.",
        true
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];

      const extension = file ? file.name.toLowerCase().split(".").pop() : "";
      if (!file || !["png", "dcm"].includes(extension)) {
        setStatus("Please choose a PNG or DICOM file.", true);
        return;
      }

      button.disabled = true;
      button.textContent = "Predicting...";
      results.hidden = true;
      setStatus(`Processing ${file.name}...`);

      try {
        const body = new FormData();
        body.append("file", file);
        const response = await fetch("/predict", { method: "POST", body });
        const responseText = await response.text();
        let data = {};

        if (responseText) {
          try {
            data = JSON.parse(responseText);
          } catch {
            throw new Error(
              `The prediction server returned an invalid response (HTTP ${response.status}). Check the server terminal for the real error.`
            );
          }
        }

        if (!response.ok) {
          throw new Error(data.error || `Prediction failed with HTTP ${response.status}.`);
        }
        if (!responseText) {
          throw new Error("The prediction server returned an empty response. Check the server terminal.");
        }

        document.getElementById("original-image").src = data.original;
        document.getElementById("mask-image").src = data.mask;
        document.getElementById("overlay-image").src = data.overlay;
        results.hidden = false;

        setStatus(data.has_segmentation
          ? `Prediction complete on ${data.device}.`
          : `Prediction complete on ${data.device}. No pixels exceeded the 0.5 threshold.`);
      } catch (error) {
        setStatus(error.message || "Could not process this file.", true);
      } finally {
        button.disabled = false;
        button.textContent = "Predict segmentation";
      }
    });
  </script>
</body>
</html>
